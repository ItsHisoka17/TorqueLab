apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: torquelab-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: torquelab.local
      http:
       paths:
        - path: /api
          pathType: Prefix
          backend:
           service:
            name: torquelab
            port:
              number: 80
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80